name: Studio CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  security-and-lint:
    name: Security Scan & Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Lint & Security Tools
        run: |
          pip install uv
          uv pip install --system flake8 bandit

      - name: Secret Leak Prevention Guard
        run: |
          echo "Checking for accidental secret files..."
          if [ -f ".env" ]; then
            echo "::error::CRITICAL: .env file found in repository! Remove it immediately!"
            exit 1
          fi
          echo "Secret guard passed: No .env detected."

      - name: Static Security Scan (Bandit)
        run: |
          # Generate Bandit JSON report
          bandit -r src/ -f json -o bandit-report.json || true
          # Parse and fail if any HIGH severity security issues exist
          python - <<'PY'
          import json, sys
          with open('bandit-report.json') as f:
              data = json.load(f)
          high_issues = [i for i in data.get('results', []) if i.get('issue_severity', '').upper() == 'HIGH']
          if high_issues:
              print(f"::error::Found {len(high_issues)} HIGH severity Bandit security issues:")
              for item in high_issues:
                  print(f"  {item.get('filename')}:{item.get('line_number')} - {item.get('issue_text')}")
              sys.exit(1)
          print("Security scan passed: 0 HIGH severity Bandit findings.")
          PY

      - name: Upload Bandit Security Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-security-report
          path: bandit-report.json

      - name: Code Quality & Syntax Verification (Flake8)
        run: |
          # Stop build if there are Python syntax errors or undefined names
          flake8 src/ tests/ --count --select=E9,F63,F7,F82 --show-source --statistics
          # Exit-zero treat all errors as warnings. The GitHub editor is 127 chars wide
          flake8 src/ tests/ --count --exit-zero --max-complexity=15 --max-line-length=135 --statistics

  test-suite:
    name: Automated Adversarial Test Suite
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache Playwright Chromium
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Install System Dependencies for Manim & Cairo
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            ffmpeg \
            libcairo2-dev \
            libpango1.0-dev

      - name: Install Python Dependencies via uv
        run: |
          pip install uv
          uv pip install --system -r requirements.txt

      - name: Install Playwright Chromium with System Dependencies (Cache Miss)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: |
          playwright install --with-deps chromium

      - name: Install Playwright System Dependencies (Cache Hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: |
          playwright install-deps chromium

      - name: Run Test Suite (Full Adversarial & Engine Tests)
        env:
          GEMINI_API_KEY: "dummy_test_key_for_ci"
          DISCORD_BOT_TOKEN: "dummy_bot_token_for_ci"
        run: |
          python -m pytest -v -n 2 --timeout=60 --durations=10
