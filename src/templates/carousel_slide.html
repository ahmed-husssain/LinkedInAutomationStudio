<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>{{TITLE}} - Slide {{SLIDE_NUMBER}}</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    :root {
      --accent: {{THEME_ACCENT}};
      --glow: {{THEME_GLOW}};
    }
    body {
      width: {{CANVAS_WIDTH}}px;
      height: {{CANVAS_HEIGHT}}px;
      overflow: hidden;
      background-color: #070a12;
      background-image:
        radial-gradient(circle at 10% 10%, var(--glow) 0%, transparent 40%),
        radial-gradient(circle at 90% 90%, rgba(30, 41, 59, 0.3) 0%, transparent 45%),
        linear-gradient(to bottom, #070a12 0%, #0b0f19 100%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      color: #f1f5f9;
      display: flex;
      flex-direction: column;
      padding: 56px;
      justify-content: space-between;
    }

    /* Specular Glass Outer Card */
    .card {
      width: 100%;
      height: 100%;
      border-top: 1px solid rgba(255, 255, 255, 0.18);
      border-left: 1px solid rgba(255, 255, 255, 0.08);
      border-right: 1px solid rgba(255, 255, 255, 0.08);
      border-bottom: 1px solid rgba(0, 0, 0, 0.5);
      border-radius: 28px;
      background: rgba(11, 16, 28, 0.8);
      backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      box-shadow: 0 30px 60px -15px rgba(0, 0, 0, 0.7), 0 0 50px var(--glow);
      padding: 52px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
    }

    /* Header with Slide Tracker and Badge */
    .header {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .top-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .topic-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 14px;
      border-radius: 9999px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--accent);
      color: var(--accent);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    .badge-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 8px var(--accent);
    }
    .slide-counter {
      font-family: Consolas, monospace;
      font-size: 14px;
      font-weight: 700;
      color: #64748b;
      letter-spacing: 0.05em;
      font-variant-numeric: tabular-nums;
    }

    /* Optical Typography */
    .title {
      font-size: 52px;
      font-weight: 800;
      color: #ffffff;
      line-height: 1.08;
      letter-spacing: -0.03em;
      text-wrap: balance;
    }
    .subtitle {
      font-size: 24px;
      font-weight: 400;
      color: #94a3b8;
      line-height: 1.35;
      letter-spacing: -0.01em;
      text-wrap: pretty;
    }

    /* Slide Center Body Stage: Fluid vertical rhythm with zero dead void */
    .stage {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-evenly;
      gap: 20px;
      margin: 12px 0;
      position: relative;
      min-height: 0;
    }

    /* Structured Narrative Blocks */
    .narrative-block {
      background: rgba(18, 24, 38, 0.65);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 18px;
      padding: 26px 30px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .narrative-block.highlight {
      border-color: var(--accent);
      background: rgba(18, 24, 38, 0.88);
      box-shadow: 0 8px 30px -4px var(--glow);
    }
    .block-tag {
      font-family: Consolas, monospace;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--accent);
    }
    .block-text {
      font-size: 19px;
      line-height: 1.55;
      color: #cbd5e1;
    }

    /* 1. Scale Profile Matrix (3-Column KPI Bar) */
    .scale-matrix {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      width: 100%;
    }
    .scale-kpi {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 14px;
      padding: 12px 16px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .scale-kpi-label {
      font-size: 10px;
      font-weight: 700;
      color: #94a3b8;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    .scale-kpi-val {
      font-family: Consolas, monospace;
      font-size: 18px;
      font-weight: 800;
      color: #ffffff;
      font-variant-numeric: tabular-nums;
    }

    /* 2. macOS-Grade Terminal & Code Specimen */
    .config-specimen {
      background: #090d16;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 16px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 12px 28px -6px rgba(0, 0, 0, 0.6);
    }
    .specimen-header {
      background: rgba(255, 255, 255, 0.04);
      padding: 8px 14px;
      display: flex;
      align-items: center;
      gap: 8px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    }
    .dot { width: 10px; height: 10px; border-radius: 50%; }
    .dot-red { background: #ef4444; }
    .dot-yellow { background: #f59e0b; }
    .dot-green { background: #10b981; }
    .specimen-title {
      font-family: Consolas, monospace;
      font-size: 11px;
      color: #64748b;
      margin-left: 6px;
      font-weight: 600;
    }
    .specimen-body {
      padding: 16px 20px;
      font-family: Consolas, 'JetBrains Mono', monospace;
      font-size: 14.5px;
      color: #38bdf8;
      line-height: 1.6;
    }

    /* 3. Senior Production Trade-Offs Matrix */
    .tradeoff-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      width: 100%;
    }
    .tradeoff-card {
      border-radius: 16px;
      padding: 18px 20px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .tradeoff-card.gain {
      background: rgba(16, 185, 129, 0.07);
      border: 1px solid rgba(16, 185, 129, 0.35);
    }
    .tradeoff-card.cost {
      background: rgba(245, 158, 11, 0.07);
      border: 1px solid rgba(245, 158, 11, 0.35);
    }
    .tradeoff-tag {
      font-family: Consolas, monospace;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    .tradeoff-text {
      font-size: 14px;
      line-height: 1.45;
      color: #cbd5e1;
    }

    /* 4. Playbook Invariant Cards */
    .playbook-card {
      background: rgba(18, 24, 38, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      padding: 20px 24px;
      display: flex;
      align-items: center;
      gap: 18px;
    }
    .playbook-num {
      font-family: Consolas, monospace;
      font-size: 12px;
      font-weight: 800;
      background: rgba(56, 189, 248, 0.15);
      color: var(--accent);
      padding: 4px 10px;
      border-radius: 8px;
      border: 1px solid var(--accent);
    }
    .playbook-content {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .playbook-title {
      font-size: 17px;
      font-weight: 700;
      color: #ffffff;
    }
    .playbook-sub {
      font-size: 14.5px;
      color: #94a3b8;
      line-height: 1.45;
    }

    /* Metrics Bar Footer */
    .footer {
      display: flex;
      flex-direction: column;
      gap: 16px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      padding-top: 20px;
    }
    .metrics-row {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
    }
    .metric-card {
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 14px;
      padding: 14px 18px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .metric-label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #64748b;
      font-weight: 700;
    }
    .metric-val {
      font-family: Consolas, monospace;
      font-size: 20px;
      font-weight: 700;
      color: #f8fafc;
      font-variant-numeric: tabular-nums;
    }

    .bottom-watermark {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      color: #64748b;
      font-weight: 500;
    }
  </style>
</head>
<body>
  <div class="card">
    <!-- Header -->
    <div class="header">
      <div class="top-meta">
        <div class="topic-badge">
          <div class="badge-dot"></div>
          <span>{{TOPIC_BADGE}}</span>
        </div>
        <span class="slide-counter">{{SLIDE_NUMBER}} / {{TOTAL_SLIDES}}</span>
      </div>
      <h1 class="title">{{TITLE}}</h1>
      <p class="subtitle">{{SUBTITLE}}</p>
    </div>

    <!-- Center Stage Content -->
    <div class="stage">
      {{STAGE_HTML}}
    </div>

    <!-- Footer -->
    <div class="footer">
      <div class="metrics-row">
        <div class="metric-card">
          <span class="metric-label">{{METRIC_1_LABEL}}</span>
          <span class="metric-val">{{METRIC_1_VALUE}}</span>
        </div>
        <div class="metric-card">
          <span class="metric-label">{{METRIC_2_LABEL}}</span>
          <span class="metric-val">{{METRIC_2_VALUE}}</span>
        </div>
      </div>
      <div class="bottom-watermark">
        <span>{{FOOTER_TEXT}}</span>
        <span>{{SWIPE_HINT}}</span>
      </div>
    </div>
  </div>
</body>
</html>
